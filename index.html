<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Ride Readiness</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root {
    --bg: #F4F7F6;
    --surface: #FFFFFF;
    --surface-2: #EAF0EE;
    --border: #DCE4E2;
    --text: #16201D;
    --text-muted: #5B6864;
    --accent: #2C6E8C;
    --accent-soft: #DCEAF0;
    --good: #2E9C5B;
    --good-soft: #E1F1E7;
    --warning: #C98A1F;
    --warning-soft: #F6ECD8;
    --serious: #C9642A;
    --serious-soft: #F6E4D8;
    --critical: #C0392B;
    --critical-soft: #F6DDD9;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E1414;
      --surface: #161F1D;
      --surface-2: #1D2826;
      --border: #2A3634;
      --text: #E6EEEC;
      --text-muted: #93A19D;
      --accent: #6BB6D6;
      --accent-soft: rgba(107,182,214,0.16);
      --good: #4CBE7B;
      --good-soft: rgba(76,190,123,0.14);
      --warning: #E0A83B;
      --warning-soft: rgba(224,168,59,0.14);
      --serious: #E3854A;
      --serious-soft: rgba(227,133,74,0.14);
      --critical: #E2564A;
      --critical-soft: rgba(226,86,74,0.14);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); }
  body {
    color: var(--text);
    font-family: 'Archivo', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 32px 20px 80px; }

  .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); }
  h1 { font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: clamp(28px, 4vw, 40px); margin: 4px 0 2px; }
  .subtitle { color: var(--text-muted); font-size: 14px; margin-bottom: 28px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; }

  .banner {
    display: flex; gap: 24px; align-items: center; padding: 24px;
    border-left: 6px solid var(--stripe, var(--accent)); margin-bottom: 28px; flex-wrap: wrap;
  }
  .banner .score { font-family: 'IBM Plex Mono', monospace; font-size: 44px; font-weight: 600; line-height: 1; color: var(--stripe, var(--accent)); min-width: 90px; }
  .banner .score small { font-size: 16px; color: var(--text-muted); font-weight: 500; }
  .banner .level { font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 20px; margin-bottom: 2px; }
  .banner .advice { color: var(--text); font-size: 14.5px; max-width: 52ch; }
  .banner .feedback { color: var(--text-muted); font-size: 13px; margin-top: 4px; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin-bottom: 28px; }
  .tile { padding: 16px 16px 12px; }
  .tile .label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px; }
  .tile .value { font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; display: flex; align-items: baseline; gap: 6px; }
  .tile .value .unit { font-size: 12px; color: var(--text-muted); font-weight: 500; font-family: 'Archivo', sans-serif; }
  .tile .delta { font-size: 12px; margin-top: 2px; font-weight: 500; }
  .tile .delta.up { color: var(--good); }
  .tile .delta.down { color: var(--critical); }
  .tile .spark-wrap { margin-top: 10px; position: relative; }
  .spark { width: 100%; height: 58px; display: block; overflow: visible; cursor: crosshair; }
  .spark-empty { color: var(--text-muted); font-size: 12px; height: 58px; display: flex; align-items: center; }
  .chart-minmax { position: absolute; right: 0; font-size: 9.5px; color: var(--text-muted); font-family: 'IBM Plex Mono', monospace; pointer-events: none; }
  .chart-minmax.max { top: -2px; }
  .chart-minmax.min { top: 46px; }
  .chart-hover-line { position: absolute; top: 0; height: 58px; width: 1px; background: var(--text-muted); display: none; pointer-events: none; }
  .chart-tooltip {
    position: absolute; top: 0; transform: translate(-50%, -100%); background: var(--text); color: var(--bg);
    font-size: 11px; font-family: 'IBM Plex Mono', monospace; padding: 3px 7px; border-radius: 6px;
    white-space: nowrap; display: none; pointer-events: none; z-index: 2;
  }
  .chart-dates { display: flex; justify-content: space-between; margin-top: 3px; }
  .chart-dates span { font-size: 10px; color: var(--text-muted); font-family: 'IBM Plex Mono', monospace; }

  section { margin-bottom: 32px; }
  h2 { font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 19px; margin: 0 0 12px; }

  .activity-item { border-bottom: 1px solid var(--border); }
  .activity-item:last-child { border-bottom: none; }
  .activity-row { display: grid; grid-template-columns: 84px 1fr auto 18px; gap: 14px; align-items: center; padding: 14px 18px; cursor: pointer; }
  .activity-row:hover { background: var(--surface-2); }
  .activity-row .date { font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; color: var(--text-muted); }
  .activity-row .name { font-weight: 600; font-size: 14.5px; }
  .activity-row .meta { font-size: 12.5px; color: var(--text-muted); margin-top: 2px; }
  .activity-row .stats { text-align: right; font-family: 'IBM Plex Mono', monospace; font-size: 13px; }
  .activity-row .chevron { color: var(--text-muted); font-size: 11px; transition: transform 0.15s ease; }
  .activity-row[aria-expanded="true"] .chevron { transform: rotate(90deg); }
  .activity-detail { padding: 4px 18px 18px; background: var(--surface-2); }
  .detail-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px 20px; }
  .detail-grid .d-label { font-size: 10.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted); }
  .detail-grid .d-value { font-family: 'IBM Plex Mono', monospace; font-size: 14.5px; margin-top: 2px; }
  .zone-bars { display: flex; gap: 3px; align-items: flex-end; height: 40px; margin: 8px 0 22px; }
  .zone-bars .zbar { flex: 1; border-radius: 3px 3px 0 0; position: relative; min-height: 2px; }
  .zone-bars .zbar span { position: absolute; bottom: -18px; left: 0; right: 0; text-align: center; font-size: 10px; color: var(--text-muted); }
  .detail-note { margin-top: 20px; font-size: 12px; color: var(--text-muted); }
  .empty { color: var(--text-muted); font-size: 13.5px; padding: 16px 18px; }

  footer { color: var(--text-muted); font-size: 12px; text-align: center; margin-top: 40px; }

  /* Password gate */
  .gate {
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .gate-card { max-width: 340px; width: 100%; padding: 28px; text-align: center; }
  .gate-card h1 { font-size: 22px; margin-bottom: 6px; }
  .gate-card p { color: var(--text-muted); font-size: 13px; margin: 0 0 18px; }
  .gate-card input {
    width: 100%; padding: 11px 14px; border-radius: 9px; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--text); font-size: 14px; margin-bottom: 10px; text-align: center;
  }
  .gate-card button {
    width: 100%; font-family: 'Archivo', sans-serif; font-weight: 600; font-size: 13.5px;
    padding: 11px 18px; border-radius: 9px; border: none; cursor: pointer; background: var(--accent); color: white;
  }
  .gate-error { color: var(--critical); font-size: 12.5px; margin-top: 8px; min-height: 16px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="card gate-card">
    <h1>🔋 Ride Readiness</h1>
    <p>Zadejte heslo pro zobrazení</p>
    <input type="password" id="pwInput" placeholder="Heslo" autofocus />
    <button id="pwBtn">Odemknout</button>
    <div class="gate-error" id="pwError"></div>
  </div>
</div>

<div class="wrap" id="app" hidden>
  <div class="eyebrow">Regenerace a trénink</div>
  <h1>Připravenost k jízdě</h1>
  <div class="subtitle" id="subtitle">Načítání dat…</div>

  <div class="card banner" id="banner">
    <div class="score" id="scoreEl">--<small>/100</small></div>
    <div>
      <div class="level" id="levelEl">Načítání…</div>
      <div class="advice" id="adviceEl"></div>
      <div class="feedback" id="feedbackEl"></div>
    </div>
  </div>

  <section>
    <h2>Dnešní hodnoty</h2>
    <div class="tiles" id="tiles"></div>
  </section>

  <section>
    <h2>Poslední jízdy</h2>
    <div class="card" id="activities"></div>
  </section>

  <footer>Statický přehled generovaný z GitHub Actions — aktualizuje se automaticky každé ráno, bez zásahu.</footer>
</div>

<script>
(function () {
  "use strict";

  // ---- password gate ----
  var PW_HASH = "37ace6086e657d3fbc98472120262c83dca9e3736e6e6881d6d4ee4963c00b69";
  function sha256Hex(text) {
    var data = new TextEncoder().encode(text);
    return crypto.subtle.digest('SHA-256', data).then(function (buf) {
      return Array.from(new Uint8Array(buf)).map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
    });
  }
  function unlock() {
    document.getElementById('gate').hidden = true;
    document.getElementById('app').hidden = false;
    loadData();
  }
  function tryUnlock() {
    var val = document.getElementById('pwInput').value;
    sha256Hex(val).then(function (hex) {
      if (hex === PW_HASH) {
        try { localStorage.setItem('ride_readiness_unlocked', '1'); } catch (e) {}
        unlock();
      } else {
        document.getElementById('pwError').textContent = 'Špatné heslo.';
      }
    });
  }
  document.getElementById('pwBtn').addEventListener('click', tryUnlock);
  document.getElementById('pwInput').addEventListener('keydown', function (e) { if (e.key === 'Enter') tryUnlock(); });
  var alreadyUnlocked = false;
  try { alreadyUnlocked = localStorage.getItem('ride_readiness_unlocked') === '1'; } catch (e) {}
  if (alreadyUnlocked) unlock();

  // ---- data + rendering (same logic as the Claude dashboard, static-data version) ----
  var state = { wellness: {}, activities: {} };

  function sortedDates(obj) { return Object.keys(obj).sort(); }
  function latestWellness() {
    var ds = sortedDates(state.wellness);
    return ds.length ? state.wellness[ds[ds.length - 1]] : null;
  }
  function fmtDate(d) {
    var parts = d.split('-');
    return parseInt(parts[2], 10) + '. ' + parseInt(parts[1], 10) + '.';
  }
  function fmtDateShort(d) {
    var parts = d.split('-');
    return parseInt(parts[2], 10) + '.' + parseInt(parts[1], 10) + '.';
  }
  function humanize(s) { return s ? s.replace(/_/g, ' ').toLowerCase() : ''; }
  function titleCase(s) { return s ? s.charAt(0) + s.slice(1).toLowerCase() : s; }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function csNum(v, decimals) { return v.toFixed(decimals == null ? 0 : decimals).replace('.', ','); }

  var LEVEL_CS = { POOR: 'Nízká', LOW: 'Nízká', MODERATE: 'Střední', FAIR: 'Průměrná', GOOD: 'Dobrá', HIGH: 'Vysoká', PRIME: 'Vynikající', EXCELLENT: 'Vynikající' };
  function trLevel(s) { return s && LEVEL_CS[s.toUpperCase()] ? LEVEL_CS[s.toUpperCase()] : titleCase(s); }
  var FEEDBACK_CS = {
    LET_YOUR_BODY_RECOVER: 'nechte tělo zregenerovat',
    TIME_TO_SLOW_DOWN: 'je čas zpomalit',
    TIME_TO_RECHARGE: 'čas dobít baterky',
    READY_FOR_ACTION: 'jste připraveni k akci',
    LISTEN_TO_YOUR_BODY: 'naslouchejte svému tělu'
  };
  function trFeedback(s) { return s ? (FEEDBACK_CS[s] || humanize(s)) : ''; }

  function statusForScore(score) {
    if (score == null) return { color: 'var(--text-muted)' };
    if (score >= 70) return { color: 'var(--good)' };
    if (score >= 50) return { color: 'var(--warning)' };
    if (score >= 25) return { color: 'var(--serious)' };
    return { color: 'var(--critical)' };
  }
  function readinessVerdict(w) {
    var score = w ? w.training_readiness : null;
    if (score == null) return "Dnes zatím není žádné měření připravenosti.";
    var isRide = score >= 50;
    var reasons = [];
    if (w.hrv_overnight != null) reasons.push('HRV ' + w.hrv_overnight + ' ms');
    if (w.sleep_hours != null) reasons.push('spánek ' + csNum(w.sleep_hours, 1) + ' h');
    if (reasons.length < 2 && w.resting_hr != null) reasons.push('klidová TF ' + w.resting_hr);
    if (reasons.length < 2 && w.stress_avg != null) reasons.push('stres ' + w.stress_avg);
    var verdict = isRide ? 'Vyjížďka' : 'Odpočinek';
    return verdict + (reasons.length ? ' — ' + reasons.slice(0, 2).join(', ') + '.' : '.');
  }

  function renderBanner() {
    var w = latestWellness();
    var score = w ? w.training_readiness : null;
    var status = statusForScore(score);
    document.getElementById('banner').style.setProperty('--stripe', status.color);
    document.getElementById('scoreEl').innerHTML = (score != null ? score : '--') + '<small>/100</small>';
    document.getElementById('levelEl').textContent = w && w.training_readiness_level ? trLevel(w.training_readiness_level) + ' připravenost' : 'Zatím žádné měření';
    document.getElementById('adviceEl').textContent = readinessVerdict(w);
    document.getElementById('feedbackEl').textContent = w && w.training_readiness_feedback ? 'Garmin: ' + trFeedback(w.training_readiness_feedback) : '';
    document.getElementById('subtitle').textContent = w ? 'Poslední synchronizace ' + fmtDate(w.date) : 'Žádná data';
  }

  function chartGeometry(points) {
    var width = 260, height = 58;
    var valid = points.filter(function (p) { return p.value != null; });
    if (!valid.length) return null;
    var vals = valid.map(function (p) { return p.value; });
    var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    var pad = (max - min) * 0.2 || Math.max(1, Math.abs(max) * 0.1) || 1;
    var lo = min - pad, hi = max + pad;
    var n = valid.length;
    var xy = valid.map(function (p, i) {
      var x = n > 1 ? (i * width / (n - 1)) : width / 2;
      var y = height - ((p.value - lo) / (hi - lo)) * height;
      return { x: x, y: y, p: p };
    });
    return { width: width, height: height, xy: xy, min: min, max: max };
  }
  function sparkline(points, color, formatVal) {
    var geo = chartGeometry(points);
    if (!geo) return '<div class="spark-empty">Zatím žádná data</div>';
    var xy = geo.xy;
    var line = xy.map(function (pt, i) { return (i === 0 ? 'M' : 'L') + pt.x.toFixed(1) + ',' + pt.y.toFixed(1); }).join(' ');
    var area = line + ' L ' + xy[xy.length - 1].x.toFixed(1) + ',' + geo.height + ' L ' + xy[0].x.toFixed(1) + ',' + geo.height + ' Z';
    var dots = xy.map(function (pt) { return '<circle cx="' + pt.x.toFixed(1) + '" cy="' + pt.y.toFixed(1) + '" r="3" fill="' + color + '"/>'; }).join('');
    var svg = '<svg class="spark" viewBox="0 0 ' + geo.width + ' ' + geo.height + '" preserveAspectRatio="none">' +
      '<path d="' + area + '" fill="' + color + '" opacity="0.14" stroke="none"/>' +
      '<path d="' + line + '" fill="none" stroke="' + color + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>' +
      dots + '</svg>';
    var dateRow = '<div class="chart-dates">' + xy.map(function (pt) { return '<span>' + fmtDateShort(pt.p.date) + '</span>'; }).join('') + '</div>';
    return '<div class="chart-minmax max">' + formatVal(geo.max) + '</div>' +
      '<div class="chart-minmax min">' + formatVal(geo.min) + '</div>' +
      svg + '<div class="chart-hover-line"></div><div class="chart-tooltip"></div>' + dateRow;
  }
  function wireChartHover(wrapEl, points, formatVal) {
    var geo = chartGeometry(points);
    var svg = wrapEl.querySelector('.spark');
    var hoverLine = wrapEl.querySelector('.chart-hover-line');
    var tooltip = wrapEl.querySelector('.chart-tooltip');
    if (!geo || !svg || !hoverLine || !tooltip) return;
    var xy = geo.xy;
    function show(clientX) {
      var rect = svg.getBoundingClientRect();
      var frac = rect.width > 1 ? (clientX - rect.left) / rect.width : 0;
      frac = Math.max(0, Math.min(1, frac));
      var idx = xy.length > 1 ? Math.round(frac * (xy.length - 1)) : 0;
      var pt = xy[idx];
      var leftPct = (pt.x / geo.width) * 100;
      hoverLine.style.left = leftPct + '%'; hoverLine.style.display = 'block';
      tooltip.style.left = leftPct + '%'; tooltip.style.top = (pt.y - 6) + 'px';
      tooltip.textContent = fmtDate(pt.p.date) + ': ' + formatVal(pt.p.value);
      tooltip.style.display = 'block';
    }
    function hide() { hoverLine.style.display = 'none'; tooltip.style.display = 'none'; }
    svg.addEventListener('mousemove', function (e) { show(e.clientX); });
    svg.addEventListener('mouseleave', hide);
    svg.addEventListener('touchstart', function (e) { if (e.touches[0]) show(e.touches[0].clientX); }, { passive: true });
    svg.addEventListener('touchmove', function (e) { if (e.touches[0]) show(e.touches[0].clientX); }, { passive: true });
    svg.addEventListener('touchend', hide);
  }

  var METRICS = [
    { key: 'hrv_overnight', label: 'HRV (přes noc)', unit: 'ms', color: 'var(--accent)', fmt: function (v) { return v; } },
    { key: 'resting_hr', label: 'Klidová TF', unit: 'bpm', color: '#7A5CC7', fmt: function (v) { return v; } },
    { key: 'sleep_hours', label: 'Spánek', unit: 'h', color: '#3D8FB0', fmt: function (v) { return v.toFixed(1); } },
    { key: 'sleep_score', label: 'Skóre spánku', unit: '', color: '#2F8F7A', fmt: function (v) { return v; } },
    { key: 'body_battery_end', label: 'Body Battery (konec dne)', unit: '', color: 'var(--good)', fmt: function (v) { return v; } },
    { key: 'stress_avg', label: 'Stres (průměr)', unit: '', color: 'var(--serious)', fmt: function (v) { return v; } },
    { key: 'steps', label: 'Kroky', unit: '', color: '#5B6864', fmt: function (v) { return v.toLocaleString(); } }
  ];
  function renderTiles() {
    var dates = sortedDates(state.wellness);
    var latest = dates.length ? state.wellness[dates[dates.length - 1]] : {};
    var prev = dates.length > 1 ? state.wellness[dates[dates.length - 2]] : null;
    var html = METRICS.map(function (m) {
      var points = dates.map(function (d) { return { date: d, value: state.wellness[d][m.key] }; });
      var val = latest ? latest[m.key] : null;
      var deltaHtml = '';
      if (prev && val != null && prev[m.key] != null) {
        var diff = val - prev[m.key];
        if (Math.abs(diff) > 0.01) {
          var cls = diff > 0 ? 'up' : 'down';
          deltaHtml = '<div class="delta ' + cls + '">' + (diff > 0 ? '▲' : '▼') + ' ' + Math.abs(diff).toFixed(diff % 1 === 0 ? 0 : 1) + ' oproti předch. dni</div>';
        }
      }
      return '<div class="card tile"><div class="label">' + m.label + '</div>' +
        '<div class="value">' + (val != null ? m.fmt(val) : '--') + (m.unit ? '<span class="unit">' + m.unit + '</span>' : '') + '</div>' +
        deltaHtml + '<div class="spark-wrap" data-metric="' + m.key + '">' + sparkline(points, m.color, m.fmt) + '</div></div>';
    }).join('');
    document.getElementById('tiles').innerHTML = html;
    document.querySelectorAll('.spark-wrap').forEach(function (wrapEl) {
      var key = wrapEl.getAttribute('data-metric');
      var metric = METRICS.filter(function (m) { return m.key === key; })[0];
      if (!metric) return;
      var points = dates.map(function (d) { return { date: d, value: state.wellness[d][metric.key] }; });
      wireChartHover(wrapEl, points, metric.fmt);
    });
  }

  var ZONE_COLORS = ['#3D8FB0', '#2E9C5B', '#C98A1F', '#C9642A', '#C0392B'];
  function renderActivities() {
    var acts = Object.keys(state.activities).map(function (k) { return state.activities[k]; })
      .sort(function (a, b) { return b.date.localeCompare(a.date); }).slice(0, 8);
    var el = document.getElementById('activities');
    if (!acts.length) { el.innerHTML = '<div class="empty">Zatím žádné synchronizované aktivity.</div>'; return; }
    el.innerHTML = acts.map(function (a) {
      var zones = a.hr_zone_minutes || [];
      var hasZones = zones.some(function (z) { return z != null; });
      var maxZone = Math.max.apply(null, zones.filter(function (z) { return z != null; }).concat([1]));
      var zoneBars = zones.map(function (z, i) {
        var h = z != null ? Math.max(2, (z / maxZone) * 40) : 2;
        return '<div class="zbar" style="height:' + h.toFixed(0) + 'px; background:' + ZONE_COLORS[i] + '"><span>Z' + (i + 1) + '</span></div>';
      }).join('');
      var detailRows = [
        ['Převýšení nahoru', a.elevation_gain_m != null ? Math.round(a.elevation_gain_m) + ' m' : null],
        ['Převýšení dolů', a.elevation_loss_m != null ? Math.round(a.elevation_loss_m) + ' m' : null],
        ['Prům. rychlost', a.avg_speed_kmh != null ? a.avg_speed_kmh + ' km/h' : null],
        ['Max. rychlost', a.max_speed_kmh != null ? a.max_speed_kmh + ' km/h' : null],
        ['Prům. kadence', a.avg_cadence_rpm != null ? Math.round(a.avg_cadence_rpm) + ' rpm' : null],
        ['Max. TF', a.max_hr != null ? Math.round(a.max_hr) + ' bpm' : null],
        ['Kalorie', a.calories != null ? Math.round(a.calories) : null],
        ['Tréninková zátěž', a.training_load != null ? a.training_load : null],
        ['Efekt tréninku', a.training_effect_label ? a.training_effect_label.replace(/_/g, ' ').toLowerCase() : null],
        ['Teplota', a.min_temp_c != null ? Math.round(a.min_temp_c) + '–' + Math.round(a.max_temp_c) + '°C' : null],
        ['Místo', a.location_name || null]
      ].filter(function (r) { return r[1] != null && r[1] !== ''; });
      var detailHtml = '<div class="detail-grid">' + detailRows.map(function (r) {
        return '<div><div class="d-label">' + r[0] + '</div><div class="d-value">' + escapeHtml(String(r[1])) + '</div></div>';
      }).join('') + '</div>';
      if (hasZones) detailHtml += '<div class="detail-note">Čas ve zónách TF (minuty)</div><div class="zone-bars">' + zoneBars + '</div>';
      return '<div class="activity-item">' +
        '<div class="activity-row" data-id="' + a.id + '" aria-expanded="false">' +
        '<div class="date">' + fmtDate(a.date) + '</div>' +
        '<div><div class="name">' + escapeHtml(a.name || 'Aktivita') + '</div>' +
        '<div class="meta">' + escapeHtml((a.type || '').replace(/_/g, ' ')) + (a.location_name ? ' · ' + escapeHtml(a.location_name) : '') + '</div></div>' +
        '<div class="stats">' + (a.distance_km != null ? a.distance_km + ' km · ' : '') + (a.duration_min != null ? Math.round(a.duration_min) + ' min' : '') +
        (a.avg_hr != null ? '<br>' + Math.round(a.avg_hr) + ' bpm avg' : '') + '</div>' +
        '<div class="chevron">▶</div></div>' +
        '<div class="activity-detail" id="detail-' + a.id + '" hidden>' + detailHtml + '</div></div>';
    }).join('');
  }
  document.getElementById('activities').addEventListener('click', function (e) {
    var row = e.target.closest('.activity-row');
    if (!row) return;
    var id = row.getAttribute('data-id');
    var detail = document.getElementById('detail-' + id);
    if (!detail) return;
    var expanded = row.getAttribute('aria-expanded') === 'true';
    row.setAttribute('aria-expanded', String(!expanded));
    detail.hidden = expanded;
  });

  function renderAll() { renderBanner(); renderTiles(); renderActivities(); }

  function loadData() {
    fetch('garmin/data.json', { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function (data) {
      state.wellness = data.wellness || {};
      state.activities = data.activities || {};
      renderAll();
    }).catch(function (err) {
      document.getElementById('subtitle').textContent = 'Nepodařilo se načíst data.json (' + err.message + ')';
    });
  }
})();
</script>
</body>
</html>
